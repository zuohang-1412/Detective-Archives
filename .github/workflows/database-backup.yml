name: Database Backup

on:
  schedule:
    - cron: "47 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detective-archives-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DATABASE_BACKUP_ENABLED == 'true' }}
    runs-on: [self-hosted, detective-archives]
    environment: production-backup
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DETECTIVE_ARCHIVES_DATABASE_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.DETECTIVE_ARCHIVES_BACKUP_PASSPHRASE }}
      PGSSLMODE: ${{ vars.DETECTIVE_ARCHIVES_PGSSLMODE || 'verify-full' }}
      BACKUP_DIRECTORY: ${{ vars.DETECTIVE_ARCHIVES_BACKUP_DIRECTORY }}
      BACKUP_RETENTION_DAYS: ${{ vars.DETECTIVE_ARCHIVES_BACKUP_RETENTION_DAYS || '14' }}
      BACKUP_KEY_ID: ${{ vars.DETECTIVE_ARCHIVES_BACKUP_KEY_ID || 'primary' }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate backup configuration
        run: >-
          test -n "$DATABASE_URL" &&
          test -n "$BACKUP_DIRECTORY" &&
          test "${#BACKUP_ENCRYPTION_PASSPHRASE}" -ge 32 &&
          printf '%s' "$BACKUP_KEY_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$'
      - name: Create and verify database backup
        run: sh ops/backup-postgres.sh
      - name: Encrypt and verify the latest backup
        id: encrypted-backup
        run: |
          latest_backup="$(find "$BACKUP_DIRECTORY" -maxdepth 1 -type f -name 'detective-archives-*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$latest_backup"
          case "$latest_backup" in
            "$BACKUP_DIRECTORY"/detective-archives-*.dump) ;;
            *) echo "Latest backup escaped the dedicated backup directory" >&2; exit 1 ;;
          esac
          sh ops/verify-backup.sh "$latest_backup"
          node scripts/encrypted-backup.mjs encrypt "$latest_backup"
          node scripts/encrypted-backup.mjs verify "$latest_backup.enc"
          rm -f -- "$latest_backup" "$latest_backup.sha256"
          echo "archive=$latest_backup.enc" >>"$GITHUB_OUTPUT"
          echo "checksum=$latest_backup.enc.sha256" >>"$GITHUB_OUTPUT"
      - name: Copy the encrypted backup off the production host
        uses: actions/upload-artifact@v7
        with:
          name: detective-archives-backup-${{ env.BACKUP_KEY_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.encrypted-backup.outputs.archive }}
            ${{ steps.encrypted-backup.outputs.checksum }}
          if-no-files-found: error
          retention-days: ${{ vars.DETECTIVE_ARCHIVES_OFFSITE_RETENTION_DAYS || '30' }}
          compression-level: 0
          include-hidden-files: false
