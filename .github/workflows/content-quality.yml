name: WeChat Content Quality

on:
  push:
    branches: [main]
    paths:
      - "content/wechat/**"
      - "tools/**"
      - "scripts/check-wechat-content.mjs"
      - "apps/api/src/data/**"
      - "package.json"
      - ".github/workflows/content-quality.yml"
  pull_request:
    paths:
      - "content/wechat/**"
      - "tools/**"
      - "scripts/check-wechat-content.mjs"
      - "apps/api/src/data/**"
      - "package.json"
      - ".github/workflows/content-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check python-docx
      - run: npm run check
      - name: Build publishable Word files
        run: npm run build:wechat -- --output-dir "${RUNNER_TEMP}/wechat-publish"
