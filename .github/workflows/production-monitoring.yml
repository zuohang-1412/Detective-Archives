name: Production Monitoring

on:
  schedule:
    - cron: "3/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: detective-archives-production-monitoring
  cancel-in-progress: true

jobs:
  monitor:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PRODUCTION_MONITORING_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
      METRICS_AUTH_TOKEN: ${{ secrets.PRODUCTION_METRICS_AUTH_TOKEN }}
      MONITOR_SAMPLE_INTERVAL_MS: ${{ vars.MONITOR_SAMPLE_INTERVAL_MS || '15000' }}
      MONITOR_MAX_5XX_RATIO: ${{ vars.MONITOR_MAX_5XX_RATIO || '0.02' }}
      MONITOR_MAX_P95_SECONDS: ${{ vars.MONITOR_MAX_P95_SECONDS || '1' }}
      MONITOR_MAX_RSS_BYTES: ${{ vars.MONITOR_MAX_RSS_BYTES || '805306368' }}
      MONITOR_MAX_EVENT_LOOP_LAG_SECONDS: ${{ vars.MONITOR_MAX_EVENT_LOOP_LAG_SECONDS || '0.25' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Probe public readiness and protected metrics
        id: probe
        continue-on-error: true
        run: node scripts/monitor-production.mjs
      - name: Open a deduplicated production incident
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[生产告警] 侦探档案馆 API 监控失败";
            try {
              await github.rest.issues.getLabel({ owner, repo, name: "production-monitoring" });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: "production-monitoring",
                color: "B60205",
                description: "由生产可用性监控自动管理"
              });
            }
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "production-monitoring",
              per_page: 100
            });
            if (!openIssues.some((issue) => !issue.pull_request && issue.title === title)) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                labels: ["production-monitoring"],
                body: [
                  "公网 `/ready`、受保护 `/metrics` 或生产阈值检查失败。",
                  "",
                  `- 运行：${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                  `- 提交：${context.sha}`,
                  `- 时间：${new Date().toISOString()}`,
                  "",
                  "请按 `docs/runbook.md` 的告警处置流程检查服务、数据库和最近发布；监控日志不会输出访问令牌。"
                ].join("\n")
              });
            }
      - name: Close production incidents after recovery
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "production-monitoring",
              per_page: 100
            });
            for (const issue of openIssues) {
              if (issue.pull_request || issue.title !== "[生产告警] 侦探档案馆 API 监控失败") continue;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `监控已恢复：${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed"
              });
            }
      - name: Preserve the failed workflow status
        if: steps.probe.outcome == 'failure'
        run: exit 1
