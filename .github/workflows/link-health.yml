name: Link Health

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detective-archives-link-health
  cancel-in-progress: false

jobs:
  check:
    if: ${{ vars.LINK_HEALTH_ENABLED == 'true' }}
    runs-on: [self-hosted, detective-archives]
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DETECTIVE_ARCHIVES_DATABASE_URL }}
      PGSSLMODE: ${{ vars.DETECTIVE_ARCHIVES_PGSSLMODE || 'verify-full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate link health configuration
        run: test -n "$DATABASE_URL"
      - run: npm ci
      - name: Check all active official links
        run: >-
          npm run links:check --
          --concurrency=3
          --retries=1
          --timeout-ms=15000
          --fail-on-broken
