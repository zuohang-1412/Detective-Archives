name: detective-archives

services:
  api:
    image: detective-archives-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    env_file:
      - path: ${API_ENV_FILE:-.env.production}
        required: true
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
    init: true
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_BIND_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s
